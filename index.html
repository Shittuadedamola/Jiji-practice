<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    />
    <title>Jiji</title>
</head>
<body>
    <section class="bg-green-500 pb-5 rounded-b-2xl mb-2">
        <nav class="h-[50px] bg-green-500 shadow-[0_3px_4px_0_rgba(0,0,0,0.2)] flex items-center justify-between px-5">
            <div class="text-white font-bold text-3xl">
                <span>Jiji</span>
            </div>
            <div class="flex">
                <div class="flex text-white items-center mr-4">
                    <i class="fa-solid fa-globe text-white mr-1"></i>
                    <h1>EN</h1>
                </div>
                <div>
                    <i class="fa-regular fa-circle-user text-3xl text-white bg-green-200 rounded-full"></i>
                </div>
            </div>
        </nav>
        <div class="text-sm">
            <h1 class="text-white font-bold mt-15 flex flex-col items-center">What are you looking for?</h1>

            <div class="flex mx-5 mt-5">
                <div class="bg-white text-gray-400 rounded-lg p-3 whitespace-nowrap mr-3">
                    <span>All Nigeria</span>
                    <i class="fa-solid fa-caret-down"></i>
                </div>
                
                <div class="relative w-full flex items-center">
                    <input
                        type="search"
                        placeholder="I am looking for..."
                        class="w-full rounded-lg border border-gray-300
                            py-3 pl-4 pr-12 outline-none
                            focus:border-green-600 focus:ring-1
                            focus:ring-green-600 bg-white"
                    />

                    <button
                        type="submit"
                        aria-label="Search"
                        class="absolute right-3 top-1/2
                            -translate-y-1/2 hover:text-green-600"
                    >
                        <i class="fa-solid fa-magnifying-glass text-emerald-700"></i>
                    </button>
                </div>
            </div>
        </div>
    </section>
    <section class="flex flex-wrap font-bold p-3">
        <div class="whitespace-nowrap bg-purple-200 border-2 border-purple-300 p-3 rounded-xl m-1">
            🔍  Niche Intelligence
        </div>
        <div class="whitespace-nowrap bg-green-200 border-2 border-green-400 p-3 rounded-xl m-1">
            💵  How to sell
        </div>
        <div class="whitespace-nowrap bg-orange-100 border-2 border-orange-300 p-3 rounded-xl m-1">
            💻  Apply for job
        </div>
        <div class="whitespace-nowrap bg-purple-200 border-2 border-purple-500 p-3 rounded-xl m-1">
            🛒  How to buy
        </div>
    </section>
    <section class="grid grid-cols-4">
        <div class="flex flex-col items-center">
            <div class="bg-orange-300 h-[80px] w-[80px] flex items-center justify-center rounded-2xl">
                <i class="fa-solid fa-plus text-orange-300 bg-white rounded-full text-3xl p-1"></i>
            </div>
            <span>Post ad</span>
        </div>
        <div class="flex flex-col items-center">
            <div class="bg-blue-100 h-[80px] w-[80px] flex items-center justify-center rounded-2xl">
                <span class="rounded-full text-4xl">🔥</span>
            </div>
            <span>Trending</span>
        </div>
        <div class="flex flex-col items-center">
            <div class="bg-blue-100 h-[80px] w-[80px] flex items-center justify-center rounded-2xl">
                <span class="rounded-full text-4xl">🚗</span>
            </div>
            <span>Vehicles</span>
        </div>
        <div class="flex flex-col items-center">
            <div class="bg-blue-100 h-[80px] w-[80px] flex items-center justify-center rounded-2xl">
                <span class="rounded-full text-4xl">🏠</span>
            </div>
            <span>Property</span>
        </div>
    </section>
</body>
</html>
